name: stack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stack:
    name: stack (${{ matrix.database }}, ${{ matrix.broker }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mysql]
        broker: [nats, sqs]
    env:
      COMPOSE_FILE: compose.yaml${{ matrix.database == 'mysql' && ':compose.mysql.yaml' || '' }}${{ matrix.broker == 'sqs' && ':compose.sqs.yaml' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the components once, to fill the caches the stack shares
        run: docker compose --profile murphy run --rm --no-deps migrate go build ./...
      - name: Start every component, without the seed data
        run: docker compose --profile murphy up -d --wait --wait-timeout 600 --scale seed=0
      - run: go test -tags stack -count=1 ./tests/stack/...
      - if: failure()
        run: docker compose --profile murphy logs --no-color
