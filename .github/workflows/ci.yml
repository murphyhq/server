name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - run: go tool buf lint
      - run: go tool buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main"
      - name: Check generated code is current
        run: |
          go tool buf generate
          go tool sqlc generate
          go tool mockery
          go tool oapi-codegen -config oapi-codegen.server.yaml openapi/v1.yaml
          go tool oapi-codegen -config oapi-codegen.client.yaml openapi/v1.yaml
          go tool oapi-codegen -config oapi-codegen.ingest.yaml openapi/ingest/v1.yaml
          git diff --exit-code
          test -z "$(git status --porcelain)"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: docker compose up -d --wait postgres redis nats localstack
      - run: go test -race -tags integration ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the components once, to fill the caches the stack shares
        run: docker compose --profile murphy run --rm --no-deps migrate go build ./...
      - name: Start every component, without the seed data
        run: docker compose --profile murphy up -d --wait --wait-timeout 600 --scale seed=0
      - run: go test -tags e2e -count=1 ./tests/e2e/...
      - if: failure()
        run: docker compose --profile murphy logs --no-color

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go tool govulncheck ./...

  images:
    runs-on: ubuntu-latest
    env:
      KO_DOCKER_REPO: ghcr.io/murphyhq
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go tool -modfile=tools/ko/go.mod ko build --base-import-paths --push=false --platform=linux/amd64,linux/arm64 ./cmd/ingest ./cmd/api ./cmd/engine ./cmd/scheduler ./cmd/notifier ./cmd/migrate
