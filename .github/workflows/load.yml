name: load

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: Traffic profile
        type: choice
        options: [all, smoke, load, stress, soak]
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  load:
    name: load (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON((inputs.profile && inputs.profile != 'all') && format('["{0}"]', inputs.profile) || '["smoke","load","stress","soak"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the components once, to fill the caches the stack shares
        run: docker compose --profile murphy run --rm --no-deps migrate go build ./...
      - name: Start every component
        run: docker compose --profile murphy up -d --wait --wait-timeout 600 --scale seed=0
      - name: Seed example data and the Grafana dogfood setup
        run: docker compose --profile murphy run --rm seed
      - run: go test -tags load -count=1 -timeout 60m -v ./tests/load/...
        env:
          MURPHY_LOAD_PROFILE: ${{ matrix.profile }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-reports-${{ matrix.profile }}-${{ github.sha }}
          path: tests/load/reports/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose --profile murphy logs --no-color
