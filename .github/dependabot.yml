version: 2

updates:
  - package-ecosystem: gomod
    directories: [/, /tools/ko]
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    ignore:
      - dependency-name: google.golang.org/protobuf
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
