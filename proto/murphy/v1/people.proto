syntax = "proto3";

package murphy.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/murphyhq/server;murphy";

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  string time_zone = 4;
  UserStatus status = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  UserRole role = 8;
}

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  USER_ROLE_ADMIN = 1;
  USER_ROLE_MEMBER = 2;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DEACTIVATED = 2;
}

message ContactMethod {
  string id = 1;
  string user_id = 2;
  ContactMethodType type = 3;
  string address = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  PushPlatform push_platform = 7;
}

enum PushPlatform {
  PUSH_PLATFORM_UNSPECIFIED = 0;
  PUSH_PLATFORM_IOS = 1;
  PUSH_PLATFORM_ANDROID = 2;
}

enum ContactMethodType {
  CONTACT_METHOD_TYPE_UNSPECIFIED = 0;
  CONTACT_METHOD_TYPE_EMAIL = 1;
  CONTACT_METHOD_TYPE_SMS = 2;
  CONTACT_METHOD_TYPE_VOICE = 3;
  CONTACT_METHOD_TYPE_WEBHOOK = 4;
  CONTACT_METHOD_TYPE_PUSH = 5;
}

message Team {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message TeamMembership {
  string id = 1;
  string team_id = 2;
  string user_id = 3;
  TeamRole role = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

enum TeamRole {
  TEAM_ROLE_UNSPECIFIED = 0;
  TEAM_ROLE_MANAGER = 1;
  TEAM_ROLE_RESPONDER = 2;
  TEAM_ROLE_OBSERVER = 3;
}

message Identity {
  string id = 1;
  string user_id = 2;
  string issuer = 3;
  string subject = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Session {
  string id = 1;
  string user_id = 2;
  bytes token_hash = 3;
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp revoked_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  SessionClient client = 8;
}

enum SessionClient {
  SESSION_CLIENT_UNSPECIFIED = 0;
  SESSION_CLIENT_BROWSER = 1;
  SESSION_CLIENT_APP = 2;
  SESSION_CLIENT_TOKEN = 3;
}

message SignIn {
  string id = 1;
  bytes state_hash = 2;
  string nonce = 3;
  string verifier = 4;
  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string return_to = 8;
  string code_challenge = 9;
}

message OneTimeCode {
  string id = 1;
  bytes code_hash = 2;
  string user_id = 3;
  OneTimeCodePurpose purpose = 4;
  string code_challenge = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp used_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

enum OneTimeCodePurpose {
  ONE_TIME_CODE_PURPOSE_UNSPECIFIED = 0;
  ONE_TIME_CODE_PURPOSE_APP_SIGN_IN = 1;
  ONE_TIME_CODE_PURPOSE_CONNECT = 2;
}
