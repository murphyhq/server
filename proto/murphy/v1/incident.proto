syntax = "proto3";

package murphy.v1;

import "google/protobuf/timestamp.proto";
import "murphy/v1/escalation.proto";
import "murphy/v1/people.proto";
import "murphy/v1/shared.proto";

option go_package = "github.com/murphyhq/server;murphy";

message Incident {
  string id = 1;
  int64 number = 2;
  string service_id = 3;
  string dedup_key = 4;
  string title = 5;
  IncidentStatus status = 6;
  Urgency urgency = 7;
  int32 version = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  google.protobuf.Timestamp resolved_at = 11;
  string escalation_policy_id = 12;
  int32 escalation_policy_version = 13;
  int32 escalation_level = 14;
  int32 escalation_round = 15;
  bool escalation_exhausted = 16;
  google.protobuf.Timestamp acknowledged_at = 17;
}

message IncidentEvent {
  IncidentVerb verb = 1;
  Incident previous = 2;
  Incident current = 3;
}

enum IncidentVerb {
  INCIDENT_VERB_UNSPECIFIED = 0;
  INCIDENT_VERB_CREATED = 1;
  INCIDENT_VERB_UPDATED = 2;
  INCIDENT_VERB_ESCALATED = 3;
  INCIDENT_VERB_ACKNOWLEDGED = 4;
  INCIDENT_VERB_RESOLVED = 5;
}

enum IncidentStatus {
  INCIDENT_STATUS_UNSPECIFIED = 0;
  INCIDENT_STATUS_TRIGGERED = 1;
  INCIDENT_STATUS_ACKNOWLEDGED = 2;
  INCIDENT_STATUS_RESOLVED = 3;
}

message TimelineEntry {
  string id = 1;
  string incident_id = 2;
  TimelineEntryType type = 3;
  string alert_id = 4;
  string summary = 5;
  google.protobuf.Timestamp at = 6;
  TimelineEscalation escalation = 7;
  TimelineNotification notification = 8;
}

message TimelineEscalation {
  int32 level = 1;
  int32 round = 2;
  repeated TimelinePage paged = 3;
  repeated EscalationTarget reached_nobody = 4;
}

message TimelineNotification {
  string notification_id = 1;
  NotificationReason reason = 2;
  string user_id = 3;
  string contact_method_id = 4;
  ContactMethodType channel = 5;
  string failure = 6;
}

message TimelinePage {
  string user_id = 1;
  EscalationTarget via = 2;
}

enum TimelineEntryType {
  TIMELINE_ENTRY_TYPE_UNSPECIFIED = 0;
  TIMELINE_ENTRY_TYPE_TRIGGERED = 1;
  TIMELINE_ENTRY_TYPE_ALERTED = 2;
  TIMELINE_ENTRY_TYPE_ACKNOWLEDGED = 3;
  TIMELINE_ENTRY_TYPE_RESOLVED = 4;
  TIMELINE_ENTRY_TYPE_ESCALATED = 5;
  TIMELINE_ENTRY_TYPE_ESCALATION_SKIPPED = 6;
  TIMELINE_ENTRY_TYPE_ESCALATION_EXHAUSTED = 7;
  TIMELINE_ENTRY_TYPE_NOTIFIED = 8;
  TIMELINE_ENTRY_TYPE_NOTIFICATION_FAILED = 9;
}

message Timer {
  string id = 1;
  string incident_id = 2;
  int32 escalation_level = 3;
  int32 escalation_round = 4;
  google.protobuf.Timestamp due_at = 5;
}

message TimerEvent {
  TimerVerb verb = 1;
  Timer previous = 2;
  Timer current = 3;
}

enum TimerVerb {
  TIMER_VERB_UNSPECIFIED = 0;
  TIMER_VERB_EXPIRED = 1;
}
