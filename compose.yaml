x-integration-key-secrets: &integration-key-secrets "1:AAEqhKjSkvjtvtCA2YD2wSsiQGaN/H1phWMk1vn35QQ="

x-component-environment: &component-environment
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: /src

x-component: &component
  image: golang:1.27.4
  profiles: [murphy]
  working_dir: /src
  volumes:
    - .:/src
    - go-mod:/go/pkg/mod
    - go-build:/root/.cache/go-build
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:9000/readyz"]
    interval: 5s
    start_period: 120s
    retries: 3
  environment: *component-environment
  depends_on:
    lgtm:
      condition: service_started
    migrate:
      condition: service_completed_successfully
    provision:
      condition: service_completed_successfully
  develop:
    watch:
      - action: restart
        path: .
        ignore:
          - .git/

services:
  postgres:
    image: postgres:19.0
    environment:
      POSTGRES_USER: murphy
      POSTGRES_PASSWORD: murphy
      POSTGRES_DB: murphy
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "murphy"]
      interval: 2s
      retries: 30

  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: murphy
      MYSQL_USER: murphy
      MYSQL_PASSWORD: murphy
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-umurphy", "-pmurphy"]
      interval: 2s
      retries: 60

  nats:
    image: nats:2.15.3-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 2s
      retries: 30

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs,sns,ssm
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  provision:
    <<: *component
    profiles: []
    command: ["sh", "-c", "go build -o /tmp/provision ./tests/provision/local && exec /tmp/provision"]
    environment:
      <<: *component-environment
      MURPHY_PROVISION_POSTGRES_URL: postgres://murphy:murphy@postgres:5432/murphy?sslmode=disable
      MURPHY_PROVISION_MYSQL_URL: mysql://root:murphy@mysql:3306/mysql
      MURPHY_PROVISION_NATS_URL: nats://nats:4222
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
      nats:
        condition: service_healthy
      localstack:
        condition: service_healthy
    develop: {}

  migrate:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/migrate ./cmd/migrate && exec /tmp/migrate"]
    environment:
      <<: *component-environment
      MURPHY_CATALOG_DATABASE_URL: postgres://murphy:murphy@postgres:5432/catalog?sslmode=disable
      MURPHY_INCIDENTS_DATABASE_URL: postgres://murphy:murphy@postgres:5432/incidents?sslmode=disable
      MURPHY_PEOPLE_DATABASE_URL: postgres://murphy:murphy@postgres:5432/people?sslmode=disable
      MURPHY_ONCALL_DATABASE_URL: postgres://murphy:murphy@postgres:5432/oncall?sslmode=disable
      MURPHY_ESCALATION_DATABASE_URL: postgres://murphy:murphy@postgres:5432/escalation?sslmode=disable
    healthcheck:
      disable: true
    depends_on:
      lgtm:
        condition: service_started
      provision:
        condition: service_completed_successfully
    develop:
      watch:
        - action: restart
          path: ./services/catalog/db/postgres/migrations
        - action: restart
          path: ./services/catalog/db/mysql/migrations
        - action: restart
          path: ./services/incidents/db/postgres/migrations
        - action: restart
          path: ./services/incidents/db/mysql/migrations
        - action: restart
          path: ./services/people/db/postgres/migrations
        - action: restart
          path: ./services/people/db/mysql/migrations
        - action: restart
          path: ./services/oncall/db/postgres/migrations
        - action: restart
          path: ./services/oncall/db/mysql/migrations
        - action: restart
          path: ./services/escalation/db/postgres/migrations
        - action: restart
          path: ./services/escalation/db/mysql/migrations

  seed:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/seed ./tests/seed && exec /tmp/seed"]
    environment:
      <<: *component-environment
      MURPHY_SEED_API_URL: http://api:8080
      MURPHY_SEED_GRAFANA_URL: http://lgtm:3000
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    develop: {}

  ingest:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/ingest ./cmd/ingest && exec /tmp/ingest"]
    environment:
      <<: *component-environment
      MURPHY_EVENTS_TOPIC_URL: nats://nats:4222/events
      MURPHY_INTEGRATION_KEY_SECRETS: *integration-key-secrets
      MURPHY_CORS_ORIGINS: http://localhost:8090
    ports:
      - "8081:8080"

  api:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/api ./cmd/api && exec /tmp/api"]
    environment:
      <<: *component-environment
      MURPHY_CATALOG_DATABASE_URL: postgres://murphy:murphy@postgres:5432/catalog?sslmode=disable
      MURPHY_INCIDENTS_DATABASE_URL: postgres://murphy:murphy@postgres:5432/incidents?sslmode=disable
      MURPHY_PEOPLE_DATABASE_URL: postgres://murphy:murphy@postgres:5432/people?sslmode=disable
      MURPHY_ONCALL_DATABASE_URL: postgres://murphy:murphy@postgres:5432/oncall?sslmode=disable
      MURPHY_ESCALATION_DATABASE_URL: postgres://murphy:murphy@postgres:5432/escalation?sslmode=disable
      MURPHY_IDEMPOTENCY_STORE_URL: redis://redis:6379/0
      MURPHY_INTEGRATION_KEY_SECRETS: *integration-key-secrets
      MURPHY_CORS_ORIGINS: http://localhost:8090
    ports:
      - "8080:8080"
    depends_on:
      lgtm:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      provision:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  engine:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/engine ./cmd/engine && exec /tmp/engine"]
    environment:
      <<: *component-environment
      MURPHY_EVENTS_SUBSCRIPTION_URL: nats://nats:4222/events/engine
      MURPHY_CATALOG_DATABASE_URL: postgres://murphy:murphy@postgres:5432/catalog?sslmode=disable
      MURPHY_INCIDENTS_DATABASE_URL: postgres://murphy:murphy@postgres:5432/incidents?sslmode=disable

  scheduler:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/scheduler ./cmd/scheduler && exec /tmp/scheduler"]

  notifier:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/notifier ./cmd/notifier && exec /tmp/notifier"]

  api-docs:
    image: nginx:1.27-alpine
    ports:
      - "8090:80"
    volumes:
      - ./openapi:/usr/share/nginx/html:ro

  db-viewer:
    image: dbgate/dbgate:7.3.4
    environment:
      CONNECTIONS: postgres,mysql
      LABEL_postgres: PostgreSQL
      ENGINE_postgres: postgres@dbgate-plugin-postgres
      SERVER_postgres: postgres
      PORT_postgres: "5432"
      USER_postgres: murphy
      PASSWORD_postgres: murphy
      LABEL_mysql: MySQL
      ENGINE_mysql: mysql@dbgate-plugin-mysql
      SERVER_mysql: mysql
      PORT_mysql: "3306"
      USER_mysql: murphy
      PASSWORD_mysql: murphy
    ports:
      - "8082:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy

volumes:
  postgres:
  mysql:
  go-mod:
  go-build:
