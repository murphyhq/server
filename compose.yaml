x-component: &component
  image: golang:1.27.4
  profiles: [murphy]
  working_dir: /src
  volumes:
    - .:/src
    - go-mod:/go/pkg/mod
    - go-build:/root/.cache/go-build
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:9000/readyz"]
    interval: 5s
    start_period: 120s
    retries: 3
  environment:
    OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  depends_on:
    lgtm:
      condition: service_started
    migrate:
      condition: service_completed_successfully
    nats:
      condition: service_healthy
    localstack:
      condition: service_healthy
  develop:
    watch:
      - action: sync+restart
        path: .
        target: /src
        ignore:
          - .git/

services:
  postgres:
    image: postgres:19.0
    environment:
      POSTGRES_USER: murphy
      POSTGRES_PASSWORD: murphy
      POSTGRES_DB: murphy
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "murphy"]
      interval: 2s
      retries: 30

  nats:
    image: nats:2.15.3-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 2s
      retries: 30

  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: sqs,sns,ssm
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 2s
      retries: 30

  lgtm:
    image: grafana/otel-lgtm:0.41.1
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"

  migrate:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/migrate ./cmd/migrate && exec /tmp/migrate"]
    healthcheck:
      disable: true
    depends_on:
      lgtm:
        condition: service_started
      postgres:
        condition: service_healthy
    develop: {}

  ingest:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/ingest ./cmd/ingest && exec /tmp/ingest"]

  api:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/api ./cmd/api && exec /tmp/api"]

  engine:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/engine ./cmd/engine && exec /tmp/engine"]

  scheduler:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/scheduler ./cmd/scheduler && exec /tmp/scheduler"]

  notifier:
    <<: *component
    command: ["sh", "-c", "go build -o /tmp/notifier ./cmd/notifier && exec /tmp/notifier"]

volumes:
  postgres:
  go-mod:
  go-build:
