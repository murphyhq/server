openapi: 3.0.3
info:
  title: Murphy relay
  version: v1
  description: Delivers a Murphy install's pages to the official app as push notifications, through APNs and FCM. Pushes carry no incident data, only where the app should look.
servers:
  - url: http://localhost:8093
    description: Local development
security:
  - installKey: []
paths:
  /v1/pushes:
    post:
      operationId: sendPush
      summary: Send a push
      description: Sends a push to a phone and answers once Apple or Google accepted it. A retry with the same `id` within a day isn't sent again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushInput"
      responses:
        "200":
          description: Accepted by Apple or Google, or already sent with this `id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Push"
        "400":
          $ref: "#/components/responses/Problem"
        "410":
          description: Apple or Google say the token is no longer valid, for example because the app was uninstalled. Stop sending to it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          description: Apple or Google refused or didn't answer. Retry later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    installKey:
      type: http
      scheme: bearer
      description: The install's key. Requests without a valid key get 401.
  responses:
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Platform:
      type: string
      enum: [ios, android]
    PushInput:
      type: object
      additionalProperties: false
      required: [id, platform, token, event, server]
      properties:
        id:
          type: string
          description: The ID of the notification this push delivers. Retries use the same ID.
        platform:
          $ref: "#/components/schemas/Platform"
        token:
          type: string
          description: The push token iOS or Android gave the app.
        event:
          type: string
          enum: [paged, acknowledged, resolved, test]
          description: "`test` is a test page someone sent to their own phone: it carries no incident, and is delivered like a page so it sounds the same."
        server:
          type: string
          description: The Murphy server the app should fetch the incident from.
        incident_id:
          type: string
          description: Present for every event except `test`.
        traceparent:
          type: string
          description: The W3C trace context of the notification's trace. The relay sends it to the phone so the app can continue the trace.
    Push:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [sent, duplicate]
          description: "`duplicate` when a push with this `id` was already sent."
    Problem:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string
          description: The trace of this request, to find it in your tracing backend.
