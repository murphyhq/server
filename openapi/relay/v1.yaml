openapi: 3.0.3
info:
  title: Murphy relay
  version: v1
  description: Delivers a Murphy install's notifications on its behalf, today as pushes to the official app through APNs and FCM. Every notification says how it's shown and what it's about; pushes carry no incident data and no words from the install, only where the app should look.
servers:
  - url: http://localhost:8093
    description: Local development
security:
  - installKey: []
paths:
  /v1/pushes:
    post:
      operationId: sendPush
      summary: Send a push
      description: Sends a push to a phone and answers once Apple or Google accepted it. A retry with the same `id` within a day isn't sent again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushInput"
      responses:
        "200":
          description: Accepted by Apple or Google, or already sent with this `id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Push"
        "400":
          $ref: "#/components/responses/Problem"
        "410":
          description: Apple or Google say the token is no longer valid, for example because the app was uninstalled. Stop sending to it.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "502":
          description: Apple or Google refused or didn't answer. Retry later.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    installKey:
      type: http
      scheme: bearer
      description: The install's key. Requests without a valid key get 401.
  responses:
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Platform:
      type: string
      enum: [ios, android]
    Category:
      type: string
      enum: [page, update, test]
      description: "How the notification is shown, in the relay's own words: `page` asks for attention now, `update` is news about something the person was paged for or is on call for, and `test` is a test page someone sent to their own contact methods. The relay never carries words from the install; the app shows what it fetches from the server instead, and the relay's words when it can't."
    Subject:
      type: object
      additionalProperties: false
      required: [type, id]
      description: What a notification is about. The relay passes it on without reading it, and the app decides what to fetch from the server.
      properties:
        type:
          type: string
          pattern: "^[a-z][a-z_]{0,31}$"
          description: The kind of thing, such as `incident` or `test`. It's never shown; the app uses it to know what to fetch.
        id:
          type: string
    PushInput:
      type: object
      additionalProperties: false
      required: [id, category, subject, server, platform, token]
      description: A notification, delivered as a push. `id`, `category`, `subject`, `server` and `traceparent` are what every kind of notification carries; `platform` and `token` say where a push goes.
      properties:
        id:
          type: string
          description: The ID of the notification this delivers. Retries use the same ID.
        category:
          $ref: "#/components/schemas/Category"
        subject:
          $ref: "#/components/schemas/Subject"
        server:
          type: string
          description: The Murphy server the app should fetch the subject from.
        traceparent:
          type: string
          description: The W3C trace context of the notification's trace. The relay sends it to the phone so the app can continue the trace.
        platform:
          $ref: "#/components/schemas/Platform"
        token:
          type: string
          description: The push token iOS or Android gave the app.
    Push:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [sent, duplicate]
          description: "`duplicate` when a push with this `id` was already sent."
    Problem:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string
          description: The trace of this request, to find it in your tracing backend.
