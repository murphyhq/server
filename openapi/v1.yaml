          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKeys"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Makes retries safe. A retry with the same key and request returns the original response for 24 hours; the same key with a different request is rejected with 422, and a retry while the first request is still running gets 409.
      schema:
        type: string
        maxLength: 255
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Items per page, 50 by default and at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page.
      schema:
        type: string
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: A session token from `POST /v1/auth/sessions`. Requests without a valid session get 401, and changes the person's roles don't allow get 403. Everyone signed in can read; admins set up the install, team managers manage their team's escalation policies, services, schedules and members, responders cover for each other with schedule overrides, responders and anyone paged respond to incidents, and everyone manages themselves.
    sessionCookie:
      type: apiKey
      in: cookie
      name: murphy_session
      description: The session cookie set when signing in through the browser.
  responses:
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PasswordLink:
      type: object
      required: [link, expires_at]
      properties:
        link:
          type: string
          description: Leads to where the person chooses a password; its `code` goes to `POST /v1/auth/password`.
        expires_at:
          type: string
          format: date-time
    PasswordInput:
      type: object
      additionalProperties: false
      required: [code, password]
      properties:
        code:
          type: string
        password:
          type: string
          format: password
    SessionInput:
      type: object
      additionalProperties: false
      properties:
        id_token:
          type: string
          description: An ID token from the install's identity provider.
        code:
          type: string
          description: A one-time code, from the app's sign-in or from a connect code.
        code_verifier:
          type: string
          description: The PKCE verifier of the app's sign-in, needed with its code.
        email:
          type: string
          description: With `password`, where the install allows passwords.
        password:
          type: string
          format: password
          description: With `email`. Repeated failures for a person or from an address are refused with `429` for a while.
    SessionSummary:
      type: object
      required: [id, client, current, created_at, expires_at]
      properties:
        id:
          type: string
        client:
          type: string
          enum: [browser, app, token]
          description: "How the session started: signing in through a browser, the app, or an identity token."
        current:
          type: boolean
          description: Whether this is the session the request was made with.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the session ends if it isn't used. Using it moves this later, up to the session's absolute timeout.
    SessionSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        next_cursor:
          type: string
          description: Empty on the last page.
    ConnectCode:
      type: object
      required: [code, link, expires_at]
      properties:
        code:
          type: string
        link:
          type: string
          description: The app's link, `murphy://connect?server=…&code=…`, to show as a QR code.
        expires_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [user, memberships, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        memberships:
          type: array
          description: The signed-in person's teams, with their role in each.
          items:
            $ref: "#/components/schemas/TeamMembership"
        expires_at:
          type: string
          format: date-time
          description: When the session ends if it isn't used. Using it moves this later, up to the session's absolute timeout.
    SessionToken:
      type: object
      required: [token, session]
      properties:
        token:
          type: string
          description: Send it as a bearer token. It is shown only once.
        session:
          $ref: "#/components/schemas/Session"
    Urgency:
      type: string
      enum: [high, low]
    ServiceStatus:
      type: string
      enum: [active, disabled]
    IntegrationType:
      type: string
      enum: [generic, alertmanager, grafana, datadog, cloudwatch, google_cloud]
    IntegrationStatus:
      type: string
      enum: [active, disabled]
    Service:
      type: object
      required: [id, name, description, escalation_policy, urgency, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        escalation_policy:
          $ref: "#/components/schemas/Reference"
        urgency:
          $ref: "#/components/schemas/Urgency"
        status:
          $ref: "#/components/schemas/ServiceStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServiceInput:
      type: object
      required: [name, escalation_policy]
      properties:
        name:
          type: string
        description:
          type: string
        escalation_policy:
          $ref: "#/components/schemas/Reference"
        urgency:
          $ref: "#/components/schemas/Urgency"
        status:
          $ref: "#/components/schemas/ServiceStatus"
    ServicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        next_cursor:
          type: string
          description: Empty on the last page.
    Integration:
      type: object
      required: [id, service, name, type, key_version, status, created_at, updated_at]
      properties:
        id:
          type: string
        service:
          $ref: "#/components/schemas/Reference"
        name:
          type: string
        type:
          $ref: "#/components/schemas/IntegrationType"
        key_version:
          type: integer
          format: int32
        previous_key_valid_until:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/IntegrationStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntegrationWithKey:
      allOf:
        - $ref: "#/components/schemas/Integration"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The integration key, sent by monitoring tools in the Authorization header.
    IntegrationCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/IntegrationType"
        status:
          $ref: "#/components/schemas/IntegrationStatus"
    IntegrationUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/IntegrationStatus"
    IntegrationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Integration"
        next_cursor:
          type: string
          description: Empty on the last page.
    IncidentStatus:
      type: string
      enum: [triggered, acknowledged, resolved]
    Incident:
      type: object
      required: [id, number, service, dedup_key, title, status, urgency, created_at, updated_at]
      properties:
        id:
          type: string
        number:
          type: integer
          format: int64
          description: Numbers incidents in the order they were opened, for people to refer to.
        service:
          $ref: "#/components/schemas/Reference"
        dedup_key:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/IncidentStatus"
        urgency:
          $ref: "#/components/schemas/Urgency"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
        escalation:
          $ref: "#/components/schemas/IncidentEscalation"
    IncidentEscalation:
      type: object
      required: [policy, level, round, exhausted]
      description: Where the incident is in its escalation policy. Level 0 means no level has been paged yet.
      properties:
        policy:
          $ref: "#/components/schemas/PolicyVersionReference"
        level:
          type: integer
          format: int32
        round:
          type: integer
          format: int32
          description: Which pass through the levels, from 1; the policy's repeat count adds more passes.
        exhausted:
          type: boolean
          description: Every level and repeat has been paged, or no level could reach anyone.
    TimelineEntry:
      type: object
      required: [id, type, summary, at]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [triggered, alerted, acknowledged, resolved, escalated, escalation_skipped, escalation_exhausted, notified, notification_failed]
          description: "`notified` is a page that reached someone. Telling people an incident was acknowledged or resolved appears only when it fails, as `notification_failed`."
        alert:
          $ref: "#/components/schemas/Reference"
        actor:
          $ref: "#/components/schemas/Reference"
          description: The person who did it; absent for what Murphy did on its own.
        summary:
          type: string
          description: What happened, in a sentence that names the people involved as they're called now.
        at:
          type: string
          format: date-time
        escalation:
          $ref: "#/components/schemas/TimelineEscalation"
        notification:
          $ref: "#/components/schemas/TimelineNotification"
    TimelineNotification:
      type: object
      required: [reason, user]
      description: A notification Murphy sent or failed to send. `notification_failed` without a contact method means the person had none.
      properties:
        reason:
          type: string
          enum: [paged, acknowledged, resolved]
        user:
          $ref: "#/components/schemas/Reference"
        contact_method:
          $ref: "#/components/schemas/Reference"
        channel:
          $ref: "#/components/schemas/ContactMethodType"
        failure:
          type: string
          description: Why it failed, on `notification_failed`.
    TimelineEscalation:
      type: object
      required: [level, round, paged, reached_nobody]
      properties:
        level:
          type: integer
          format: int32
        round:
          type: integer
          format: int32
        paged:
          type: array
          description: The people paged, each with the target that reached them.
          items:
            $ref: "#/components/schemas/Page"
        reached_nobody:
          type: array
          description: The level's targets that reached nobody, such as a schedule with no one on call.
          items:
            $ref: "#/components/schemas/EscalationTarget"
    Page:
      type: object
      required: [user, via]
      properties:
        user:
          $ref: "#/components/schemas/Reference"
        via:
          $ref: "#/components/schemas/EscalationTarget"
    SigningKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SigningKey"
    SigningKey:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: The Ed25519 public key, as `whpk_` followed by its base64 encoding.
    Reference:
      type: object
      required: [id]
      description: Points at another resource.
      properties:
        id:
          type: string
        name:
          type: string
          description: The resource's current name, for resources that have one, in responses to reads; empty once the resource is deleted. Ignored in requests.
    PolicyVersionReference:
      type: object
      required: [id, version]
      description: Points at one version of an escalation policy.
      properties:
        id:
          type: string
        name:
          type: string
          description: The policy's current name, in responses to reads; empty once the policy is deleted.
        version:
          type: integer
          format: int32
    IncidentWithTimeline:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          required: [timeline, viewer]
          properties:
            timeline:
              type: array
              items:
                $ref: "#/components/schemas/TimelineEntry"
            viewer:
              $ref: "#/components/schemas/IncidentViewer"
    IncidentViewer:
      type: object
      description: What the signed-in person can do to this incident, by the same rules the actions enforce.
      required: [can_acknowledge, can_resolve]
      properties:
        can_acknowledge:
          type: boolean
        can_resolve:
          type: boolean
    IncidentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        next_cursor:
          type: string
          description: Empty on the last page.
    UserStatus:
      type: string
      enum: [active, deactivated]
    User:
      type: object
      required: [id, name, email, time_zone, status, role, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        time_zone:
          type: string
          description: IANA time zone, as in Europe/Malta.
        status:
          $ref: "#/components/schemas/UserStatus"
        role:
          type: string
          enum: [admin, member]
          description: Admins manage the whole install. The first admin is whoever signs in with the install's initial admin email.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        time_zone:
          type: string
          description: IANA time zone; UTC by default.
        status:
          $ref: "#/components/schemas/UserStatus"
    UserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          description: Empty on the last page.
    ContactMethodType:
      type: string
      enum: [email, sms, voice, webhook, push]
      description: Murphy sends by webhook, push and email for now; contact methods of the other types are refused until it can send by them. Email goes out once an admin has set up the email provider.
    ContactMethod:
      type: object
      required: [id, user, type, address, created_at, updated_at]
      properties:
        id:
          type: string
        user:
          $ref: "#/components/schemas/Reference"
        type:
          $ref: "#/components/schemas/ContactMethodType"
        address:
          type: string
          description: An email address, an E.164 phone number, a webhook URL, or the push token iOS or Android gave the app.
        platform:
          $ref: "#/components/schemas/PushPlatform"
        disabled_at:
          type: string
          format: date-time
          description: When Murphy stopped using this contact method because its address no longer works, such as a push token the phone no longer has. A disabled contact method is never used to reach anyone; updating it with a new address enables it again.
        disabled_reason:
          type: string
          description: Why it was disabled.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EmailProviderInput:
      type: object
      required: [type, from, host, port]
      properties:
        type:
          $ref: "#/components/schemas/EmailProviderType"
        from:
          type: string
          description: The sender, as in `Murphy <murphy@example.com>`.
        host:
          type: string
          description: The SMTP server.
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: Usually 587, where Murphy upgrades the connection with STARTTLS, or 465 for TLS from the start.
        username:
          type: string
          description: Required with a secret.
        secret:
          type: string
          description: Where Murphy reads the password, never the password itself, as `env://NAME`, `file:///path` or `aws-ssm:///name`. `notifier` reads it each time it sends.
    EmailProviderType:
      type: string
      enum: [smtp]
    EmailProvider:
      type: object
      required: [type, from, host, port, username, secret, updated_at, status, problem]
      properties:
        type:
          $ref: "#/components/schemas/EmailProviderType"
        from:
          type: string
          description: The sender, as in `Murphy <murphy@example.com>`.
        host:
          type: string
          description: The SMTP server.
        port:
          type: integer
          format: int32
          minimum: 1
          maximum: 65535
          description: Usually 587, where Murphy upgrades the connection with STARTTLS, or 465 for TLS from the start.
        username:
          type: string
          description: Required with a secret.
        secret:
          type: string
          description: Where Murphy reads the password, never the password itself, as `env://NAME`, `file:///path` or `aws-ssm:///name`. `notifier` reads it when it checks the provider, every minute, and only where the install allows (by default environment variables starting with `MURPHY_SECRET_`, files under `/run/secrets` and parameters under `/murphy/`).
        updated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, ready, failing]
          description: "`pending` until `notifier` has checked the provider since it was last saved. `notifier` checks it every minute by signing in to the mail server over TLS: `ready` when that worked, `failing` when it didn't, with the reason in `problem`. While failing, Murphy keeps sending with the last settings that worked, if any."
        problem:
          type: string
          description: Why the last check failed. Empty unless `status` is `failing`.
        checked_at:
          type: string
          format: date-time
          description: When `notifier` last checked the provider.
    ContactMethodInput:
      type: object
      required: [type, address]
      properties:
        type:
          $ref: "#/components/schemas/ContactMethodType"
        address:
          type: string
          description: An email address, an E.164 phone number, a webhook URL, or the push token iOS or Android gave the app. When the app's token changes, update the contact method.
        platform:
          $ref: "#/components/schemas/PushPlatform"
    PushPlatform:
      type: string
      enum: [ios, android]
      description: Push only. The phone's platform, which decides whether the push relay sends through Apple or Google.
    ContactMethodList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactMethod"
    Team:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeamInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
    TeamPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        next_cursor:
          type: string
          description: Empty on the last page.
    TeamRole:
      type: string
      enum: [manager, responder, observer]
    TeamMembership:
      type: object
      required: [team, user, role, created_at, updated_at]
      properties:
        team:
          $ref: "#/components/schemas/Reference"
        user:
          $ref: "#/components/schemas/Reference"
        role:
          $ref: "#/components/schemas/TeamRole"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeamMemberInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/TeamRole"
    TeamMembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMembership"
    Layer:
      type: object
      required: [participants, turn_length_seconds, starts_at]
      properties:
        name:
          type: string
        participants:
          type: array
          description: The people who take turns, in order.
          items:
            $ref: "#/components/schemas/Reference"
        turn_length_seconds:
          type: integer
          format: int64
          description: How long each turn lasts. Whole days hand over at the same local time every day, in the schedule's time zone.
        starts_at:
          type: string
          format: date-time
    Schedule:
      type: object
      required: [id, name, time_zone, teams, layers, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        time_zone:
          type: string
        teams:
          type: array
          description: The teams that use this schedule.
          items:
            $ref: "#/components/schemas/Reference"
        layers:
          type: array
          description: Later layers take precedence over earlier ones once they start.
          items:
            $ref: "#/components/schemas/Layer"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScheduleInput:
      type: object
      required: [name, layers]
      properties:
        name:
          type: string
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        time_zone:
          type: string
          description: IANA time zone; UTC by default.
        layers:
          type: array
          items:
            $ref: "#/components/schemas/Layer"
    SchedulePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        next_cursor:
          type: string
          description: Empty on the last page.
    Override:
      type: object
      required: [id, schedule, user, starts_at, ends_at, created_at]
      properties:
        id:
          type: string
        schedule:
          $ref: "#/components/schemas/Reference"
        user:
          $ref: "#/components/schemas/Reference"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    OverrideInput:
      type: object
      required: [user, starts_at, ends_at]
      properties:
        user:
          $ref: "#/components/schemas/Reference"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    OverrideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Override"
    OnCall:
      type: object
      required: [at]
      properties:
        at:
          type: string
          format: date-time
        user:
          allOf:
            - $ref: "#/components/schemas/Reference"
          description: Absent when nobody is on call.
    ScheduleOnCall:
      type: object
      required: [schedule, at]
      properties:
        schedule:
          $ref: "#/components/schemas/Reference"
        at:
          type: string
          format: date-time
        user:
          allOf:
            - $ref: "#/components/schemas/Reference"
          description: Absent when nobody is on call.
    OnCallPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleOnCall"
        next_cursor:
          type: string
          description: Empty on the last page.
    EscalationTargetType:
      type: string
      enum: [user, schedule]
    EscalationTarget:
      type: object
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/EscalationTargetType"
        id:
          type: string
        name:
          type: string
          description: The user's or schedule's current name, in responses to reads; empty once it is deleted. Ignored in requests.
    EscalationLevel:
      type: object
      required: [delay_seconds, targets]
      properties:
        delay_seconds:
          type: integer
          format: int64
          description: How long to wait for an acknowledgement before the next level.
        targets:
          type: array
          items:
            $ref: "#/components/schemas/EscalationTarget"
    EscalationPolicy:
      type: object
      required: [id, name, team, version, repeat_count, levels, created_at, updated_at]
      properties:
        id:
          type: string
        version:
          type: integer
          format: int32
          description: The policy's current version, starting at 1. Every update makes the next one.
        name:
          type: string
        team:
          allOf:
            - $ref: "#/components/schemas/Reference"
          description: The team that owns the policy, and with it the services that page through it.
        repeat_count:
          type: integer
          format: int32
          description: How many times to go through the levels again when nobody acknowledges.
        levels:
          type: array
          items:
            $ref: "#/components/schemas/EscalationLevel"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EscalationPolicyInput:
      type: object
      required: [name, team, levels]
      properties:
        name:
          type: string
        team:
          $ref: "#/components/schemas/Reference"
        repeat_count:
          type: integer
          format: int32
        levels:
          type: array
          items:
            $ref: "#/components/schemas/EscalationLevel"
    EscalationPolicyPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EscalationPolicy"
        next_cursor:
          type: string
          description: Empty on the last page.
    Problem:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string
          description: The trace of this request, to find it in your tracing backend.
