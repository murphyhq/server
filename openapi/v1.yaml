openapi: 3.0.3
info:
  title: Murphy API
  version: v1
  license:
    name: AGPL-3.0
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - session: []
  - sessionCookie: []
paths:
  /v1/auth/sign-in:
    get:
      operationId: signIn
      summary: Sign in through the identity provider
      description: Sends the browser to the install's identity provider. Once the person has signed in there, the provider sends them back to `/v1/auth/callback`.
      tags: [auth]
      security: []
      parameters:
        - name: return_to
          in: query
          description: Where to send the browser once signed in. It must be on `api`'s own origin or one of the install's CORS origins, or be the app's `murphy://signed-in`, which receives a one-time `code` instead of a cookie.
          schema:
            type: string
        - name: code_challenge
          in: query
          description: Required when returning to the app. The S256 PKCE challenge of a verifier only the app knows; exchanging the one-time code needs that verifier.
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/Problem"
        "302":
          description: Go to the identity provider. The `murphy_sign_in` cookie ties the sign-in to this browser.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
  /v1/auth/callback:
    get:
      operationId: finishSignIn
      summary: Finish signing in
      description: Where the identity provider sends the browser back. Signs the person in and sets the session cookie.
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
        - name: murphy_sign_in
          in: cookie
          description: Set when the sign-in started, so only the browser that started it can finish it.
          schema:
            type: string
      responses:
        "303":
          description: Signed in, and sent back to the `return_to` the sign-in started with. A browser gets the session in the `murphy_session` cookie; the app gets a one-time `code` on its link to exchange with `POST /v1/auth/sessions`.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        "200":
          description: Signed in. The session is in the `murphy_session` cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/auth/password:
    post:
      operationId: setPassword
      summary: Set a password from a set-password link
      description: Takes the code from a set-password link and the new password, sets it, and ends the person's other sessions. A password too short or too long leaves the link usable.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInput"
      responses:
        "204":
          description: The password is set.
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
  /v1/auth/sessions:
    get:
      operationId: listSessions
      security:
        - session: [sessions:own]
        - sessionCookie: [sessions:own]
      summary: List your sessions
      description: Your sessions that are still active, newest first.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Your active sessions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummaryPage"
        "400":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: signOutEverywhere
      security:
        - session: [sessions:own]
        - sessionCookie: [sessions:own]
      summary: Sign out everywhere
      description: Ends all your sessions at once, this one included, and discards your unused one-time codes, such as connect codes.
      tags: [auth]
      responses:
        "204":
          description: Signed out everywhere.
          headers:
            Set-Cookie:
              schema:
                type: string
    post:
      operationId: createSession
      summary: Sign in with an identity token or a one-time code
      description: Signs in with an ID token the install's identity provider issued to Murphy's client, or with a one-time code from the app's sign-in or a connect code. Send exactly one of `id_token` and `code`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/auth/sessions/{id}:
    delete:
      operationId: endSession
      security:
        - session: [sessions:own]
        - sessionCookie: [sessions:own]
      summary: End one of your sessions
      description: Ends one of your own sessions at once, such as a lost phone's.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Ended.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/auth/connect-codes:
    post:
      operationId: createConnectCode
      security:
        - session: [sessions:own]
        - sessionCookie: [sessions:own]
      summary: Connect the app
      description: Creates a one-time code that signs the app in as you, valid for 45 seconds. Show its link as a QR code for the app to scan.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectCode"
  /v1/auth/session:
    get:
      operationId: getSession
      security:
        - session: [sessions:own]
        - sessionCookie: [sessions:own]
      summary: Get the current session
      tags: [auth]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    delete:
      operationId: signOut
      security:
        - session: [sessions:own]
        - sessionCookie: [sessions:own]
      summary: Sign out
      description: Ends the current session at once.
      tags: [auth]
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema:
                type: string
  /v1/services:
    get:
      operationId: listServices
      summary: List services
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Services, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePage"
        "400":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createService
      security:
        - session: [policies:manage]
        - sessionCookie: [policies:manage]
      x-murphy-resources:
        policies:manage: body.escalation_policy.id
      summary: Create a service
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: The created service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/services/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getService
      summary: Get a service
      tags: [catalog]
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateService
      security:
        - session: [services:manage, policies:manage]
        - sessionCookie: [services:manage, policies:manage]
      x-murphy-resources:
        policies:manage: body.escalation_policy.id
      summary: Update a service
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: The updated service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteService
      security:
        - session: [services:manage]
        - sessionCookie: [services:manage]
      summary: Delete a service
      tags: [catalog]
      responses:
        "204":
          description: The service and its integrations were deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/services/{id}/integrations:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listIntegrations
      summary: List a service's integrations
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The service's integrations, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createIntegration
      security:
        - session: [services:manage]
        - sessionCookie: [services:manage]
      summary: Create an integration
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationCreate"
      responses:
        "201":
          description: The created integration, with its key. The key is only shown in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationWithKey"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/integrations/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getIntegration
      summary: Get an integration
      tags: [catalog]
      responses:
        "200":
          description: The integration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateIntegration
      security:
        - session: [integrations:manage]
        - sessionCookie: [integrations:manage]
      summary: Update an integration
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationUpdate"
      responses:
        "200":
          description: The updated integration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteIntegration
      security:
        - session: [integrations:manage]
        - sessionCookie: [integrations:manage]
      summary: Delete an integration
      tags: [catalog]
      responses:
        "204":
          description: The integration was deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/integrations/{id}/key:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: rotateIntegrationKey
      security:
        - session: [integrations:manage]
        - sessionCookie: [integrations:manage]
      summary: Rotate an integration's key
      description: Issues a new key and bumps the key version. The previous key keeps working for 24 hours, until previous_key_valid_until.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The integration, with its new key. The key is only shown in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationWithKey"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/incidents:
    get:
      operationId: listIncidents
      summary: List incidents
      tags: [incidents]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Only incidents with one of these statuses.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IncidentStatus"
        - name: service_id
          in: query
          description: Only incidents of one of these services.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: team_id
          in: query
          description: Only incidents owned by one of these teams, through their escalation policies.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: paged_user_id
          in: query
          description: Only incidents that paged one of these people.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: urgency
          in: query
          description: Only incidents with one of these urgencies.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Urgency"
        - name: created_after
          in: query
          description: Only incidents opened after this time.
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          description: Only incidents opened before this time.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Incidents, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/Problem"
  /v1/incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getIncident
      summary: Get an incident with its timeline
      tags: [incidents]
      responses:
        "200":
          description: The incident and its timeline, oldest entry first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentWithTimeline"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/incidents/{id}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: acknowledgeIncident
      security:
        - session: [incidents:respond]
        - sessionCookie: [incidents:respond]
      summary: Acknowledge an incident, which stops its escalation
      description: An incident someone already acknowledged can be acknowledged again, by them or anyone else. Each acknowledgement goes on its timeline, and the incident and its notifications stay as they were.
      tags: [incidents]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The incident after the change, or as it was if it had already changed this way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/incidents/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: resolveIncident
      security:
        - session: [incidents:respond]
        - sessionCookie: [incidents:respond]
      summary: Resolve an incident
      tags: [incidents]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The incident after the change, or as it was if it had already changed this way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/users:
    get:
      operationId: listUsers
      summary: List users
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      security:
        - session: [install:manage]
        - sessionCookie: [install:manage]
      summary: Create a user
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getUser
      summary: Get a user
      tags: [people]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateUser
      security:
        - session: [users:self, install:manage]
        - sessionCookie: [users:self, install:manage]
      x-murphy-resources:
        install:manage: body.status?
      summary: Update a user
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUser
      security:
        - session: [install:manage]
        - sessionCookie: [install:manage]
      summary: Delete a user
      tags: [people]
      responses:
        "204":
          description: Done.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/sessions:
    delete:
      operationId: endUserSessions
      security:
        - session: [install:manage]
        - sessionCookie: [install:manage]
      summary: End all of a user's sessions
      description: Ends all the user's sessions at once and discards their unused one-time codes, without deactivating them. Only admins may do this.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Ended.
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/password-links:
    post:
      operationId: createPasswordLink
      security:
        - session: [install:manage]
        - sessionCookie: [install:manage]
      summary: Create a link to set a user's password
      description: A link that lets the person choose a password, to invite them or to reset theirs. Share it however you like; it works once, for 24 hours. Only admins may do this, on installs that allow passwords.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordLink"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/contact-methods:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listContactMethods
      security:
        - session: [users:self]
        - sessionCookie: [users:self]
      summary: List a user's contact methods
      tags: [people]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethodList"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createContactMethod
      security:
        - session: [users:self]
        - sessionCookie: [users:self]
      summary: Add a contact method to a user
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMethodInput"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethod"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/contact-methods/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getContactMethod
      security:
        - session: [contact-methods:own]
        - sessionCookie: [contact-methods:own]
      summary: Get a contact method
      tags: [people]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethod"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateContactMethod
      security:
        - session: [contact-methods:own]
        - sessionCookie: [contact-methods:own]
      summary: Update a contact method
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMethodInput"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethod"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteContactMethod
      security:
        - session: [contact-methods:own]
        - sessionCookie: [contact-methods:own]
      summary: Delete a contact method
      tags: [people]
      responses:
        "204":
          description: Done.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/teams:
    get:
      operationId: listTeams
      summary: List teams
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Teams, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPage"
        "400":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTeam
      security:
        - session: [install:manage]
        - sessionCookie: [install:manage]
      summary: Create a team
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: The created team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
