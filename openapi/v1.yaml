openapi: 3.0.3
info:
  title: Murphy API
  version: v1
  license:
    name: AGPL-3.0
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - session: []
  - sessionCookie: []
paths:
  /v1/auth/sign-in:
    get:
      operationId: signIn
      summary: Sign in through the identity provider
      description: Sends the browser to the install's identity provider. Once the person has signed in there, the provider sends them back to `/v1/auth/callback`.
      tags: [auth]
      security: []
      parameters:
        - name: return_to
          in: query
          description: Where to send the browser once signed in. It must be on `api`'s own origin or one of the install's CORS origins, or be the app's `murphy://signed-in`, which receives a one-time `code` instead of a cookie.
          schema:
            type: string
        - name: code_challenge
          in: query
          description: Required when returning to the app. The S256 PKCE challenge of a verifier only the app knows; exchanging the one-time code needs that verifier.
          schema:
            type: string
      responses:
        "400":
          $ref: "#/components/responses/Problem"
        "302":
          description: Go to the identity provider. The `murphy_sign_in` cookie ties the sign-in to this browser.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
  /v1/auth/callback:
    get:
      operationId: finishSignIn
      summary: Finish signing in
      description: Where the identity provider sends the browser back. Signs the person in and sets the session cookie.
      tags: [auth]
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
        - name: murphy_sign_in
          in: cookie
          description: Set when the sign-in started, so only the browser that started it can finish it.
          schema:
            type: string
      responses:
        "303":
          description: Signed in, and sent back to the `return_to` the sign-in started with. A browser gets the session in the `murphy_session` cookie; the app gets a one-time `code` on its link to exchange with `POST /v1/auth/sessions`.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              schema:
                type: string
        "200":
          description: Signed in. The session is in the `murphy_session` cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/auth/sessions:
    get:
      operationId: listSessions
      summary: List your sessions
      description: Your sessions that are still active, newest first.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Your active sessions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummaryPage"
        "400":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: signOutEverywhere
      summary: Sign out everywhere
      description: Ends all your sessions at once, this one included, and discards your unused one-time codes, such as connect codes.
      tags: [auth]
      responses:
        "204":
          description: Signed out everywhere.
          headers:
            Set-Cookie:
              schema:
                type: string
    post:
      operationId: createSession
      summary: Sign in with an identity token or a one-time code
      description: Signs in with an ID token the install's identity provider issued to Murphy's client, or with a one-time code from the app's sign-in or a connect code. Send exactly one of `id_token` and `code`.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "201":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionToken"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
  /v1/auth/sessions/{id}:
    delete:
      operationId: endSession
      summary: End one of your sessions
      description: Ends one of your own sessions at once, such as a lost phone's.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Ended.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/auth/connect-codes:
    post:
      operationId: createConnectCode
      summary: Connect the app
      description: Creates a one-time code that signs the app in as you, valid for 45 seconds. Show its link as a QR code for the app to scan.
      tags: [auth]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectCode"
  /v1/auth/session:
    get:
      operationId: getSession
      summary: Get the current session
      tags: [auth]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    delete:
      operationId: signOut
      summary: Sign out
      description: Ends the current session at once.
      tags: [auth]
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema:
                type: string
  /v1/services:
    get:
      operationId: listServices
      summary: List services
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Services, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePage"
        "400":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createService
      summary: Create a service
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: The created service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/services/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getService
      summary: Get a service
      tags: [catalog]
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateService
      summary: Update a service
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: The updated service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteService
      summary: Delete a service
      tags: [catalog]
      responses:
        "204":
          description: The service and its integrations were deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/services/{id}/integrations:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listIntegrations
      summary: List a service's integrations
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The service's integrations, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createIntegration
      summary: Create an integration
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationCreate"
      responses:
        "201":
          description: The created integration, with its key. The key is only shown in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationWithKey"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/integrations/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getIntegration
      summary: Get an integration
      tags: [catalog]
      responses:
        "200":
          description: The integration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateIntegration
      summary: Update an integration
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationUpdate"
      responses:
        "200":
          description: The updated integration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteIntegration
      summary: Delete an integration
      tags: [catalog]
      responses:
        "204":
          description: The integration was deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/integrations/{id}/key:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: rotateIntegrationKey
      summary: Rotate an integration's key
      description: Issues a new key and bumps the key version. The previous key keeps working for 24 hours, until previous_key_valid_until.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The integration, with its new key. The key is only shown in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationWithKey"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/incidents:
    get:
      operationId: listIncidents
      summary: List incidents
      tags: [incidents]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Only incidents with one of these statuses.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IncidentStatus"
        - name: service_id
          in: query
          description: Only incidents of one of these services.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Incidents, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/Problem"
  /v1/incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getIncident
      summary: Get an incident with its timeline
      tags: [incidents]
      responses:
        "200":
          description: The incident and its timeline, oldest entry first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentWithTimeline"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/incidents/{id}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: acknowledgeIncident
      summary: Acknowledge an incident, which stops its escalation
      tags: [incidents]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The incident after the change, or as it was if it had already changed this way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/incidents/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: resolveIncident
      summary: Resolve an incident
      tags: [incidents]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The incident after the change, or as it was if it had already changed this way.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/users:
    get:
      operationId: listUsers
      summary: List users
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      summary: Create a user
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/users/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getUser
      summary: Get a user
      tags: [people]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateUser
      summary: Update a user
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteUser
      summary: Delete a user
      tags: [people]
      responses:
        "204":
          description: Done.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/sessions:
    delete:
      operationId: endUserSessions
      summary: End all of a user's sessions
      description: Ends all the user's sessions at once and discards their unused one-time codes, without deactivating them. Only admins may do this.
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Ended.
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/users/{id}/contact-methods:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listContactMethods
      summary: List a user's contact methods
      tags: [people]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethodList"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createContactMethod
      summary: Add a contact method to a user
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMethodInput"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethod"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/contact-methods/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getContactMethod
      summary: Get a contact method
      tags: [people]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethod"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateContactMethod
      summary: Update a contact method
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMethodInput"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMethod"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteContactMethod
      summary: Delete a contact method
      tags: [people]
      responses:
        "204":
          description: Done.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/teams:
    get:
      operationId: listTeams
      summary: List teams
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Teams, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamPage"
        "400":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createTeam
      summary: Create a team
      tags: [people]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: The created team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/teams/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getTeam
      summary: Get a team
      tags: [people]
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateTeam
      summary: Update a team
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "200":
          description: The updated team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteTeam
      summary: Delete a team
      tags: [people]
      responses:
        "204":
          description: The team was deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/teams/{id}/members:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listTeamMembers
      summary: List a team's members
      tags: [people]
      responses:
        "200":
          description: The team's members with their roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMembershipList"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/teams/{id}/members/{user_id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: user_id
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: setTeamMember
      summary: Add a member to a team, or change their role
      tags: [people]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMembership"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: removeTeamMember
      summary: Remove a member from a team
      tags: [people]
      responses:
        "204":
          description: The member was removed.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/schedules:
    get:
      operationId: listSchedules
      summary: List schedules
      tags: [on-call]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: team_id
          in: query
          description: Only those associated with this team.
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePage"
        "400":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createSchedule
      summary: Create a schedule
      tags: [on-call]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getSchedule
      summary: Get a schedule
      tags: [on-call]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateSchedule
      summary: Update a schedule
      tags: [on-call]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleInput"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSchedule
      summary: Delete a schedule
      tags: [on-call]
      responses:
        "204":
          description: Done.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/schedules/{id}/overrides:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listOverrides
      summary: List a schedule's overrides
      tags: [on-call]
      parameters:
        - name: ends_after
          in: query
          description: Only overrides that end after this time; now by default.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverrideList"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createOverride
      summary: Override a schedule for a time range
      tags: [on-call]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverrideInput"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Override"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/overrides/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    delete:
      operationId: deleteOverride
      summary: Delete an override
      tags: [on-call]
      responses:
        "204":
          description: Done.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/schedules/{id}/on-call:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getOnCall
      summary: Find who is on call
      description: Computes who is on call at a moment, from the schedule's layers and overrides.
      tags: [on-call]
      parameters:
        - name: at
          in: query
          description: The moment to ask about; now by default.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnCall"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/escalation-policies:
    get:
      operationId: listEscalationPolicies
      summary: List escalation policies
      tags: [escalation]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: team_id
          in: query
          description: Only those owned by this team.
          schema:
            type: string
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationPolicyPage"
        "400":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createEscalationPolicy
      summary: Create an escalation policy
      tags: [escalation]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationPolicyInput"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationPolicy"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/escalation-policies/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getEscalationPolicy
      summary: Get an escalation policy
      tags: [escalation]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationPolicy"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateEscalationPolicy
      summary: Update an escalation policy
      tags: [escalation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EscalationPolicyInput"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationPolicy"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteEscalationPolicy
      summary: Delete an escalation policy
      description: A policy that services still page with can't be deleted. Incidents that followed the policy keep reading its versions.
      tags: [escalation]
      responses:
        "204":
          description: Done.
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/escalation-policies/{id}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int32
          minimum: 1
    get:
      operationId: getEscalationPolicyVersion
      summary: Get a version of an escalation policy
      description: Every change to a policy makes a new version, numbered from 1; this returns one of them as it was saved.
      tags: [escalation]
      responses:
        "200":
          description: The policy at that version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationPolicy"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/signing-keys:
    get:
      operationId: getSigningKeys
      security: []
      summary: Get the public keys that sign webhooks
      description: Webhooks Murphy sends are signed with Ed25519 (Standard Webhooks `v1a`). Check a webhook's signature with any of these keys; while a key is being replaced, both the old and the new one are listed.
      tags: [notifications]
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningKeys"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Makes retries safe. A retry with the same key and request returns the original response for 24 hours; the same key with a different request is rejected with 422, and a retry while the first request is still running gets 409.
      schema:
        type: string
        maxLength: 255
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Items per page, 50 by default and at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page.
      schema:
        type: string
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: A session token from `POST /v1/auth/sessions`. Requests without a valid session get 401.
    sessionCookie:
      type: apiKey
      in: cookie
      name: murphy_session
      description: The session cookie set when signing in through the browser.
  responses:
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    SessionInput:
      type: object
      additionalProperties: false
      properties:
        id_token:
          type: string
          description: An ID token from the install's identity provider.
        code:
          type: string
          description: A one-time code, from the app's sign-in or from a connect code.
        code_verifier:
          type: string
          description: The PKCE verifier of the app's sign-in, needed with its code.
    SessionSummary:
      type: object
      required: [id, client, current, created_at, expires_at]
      properties:
        id:
          type: string
        client:
          type: string
          enum: [browser, app, token]
          description: "How the session started: signing in through a browser, the app, or an identity token."
        current:
          type: boolean
          description: Whether this is the session the request was made with.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    SessionSummaryPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        next_cursor:
          type: string
          description: Empty on the last page.
    ConnectCode:
      type: object
      required: [code, link, expires_at]
      properties:
        code:
          type: string
        link:
          type: string
          description: The app's link, `murphy://connect?server=…&code=…`, to show as a QR code.
        expires_at:
          type: string
          format: date-time
    Session:
      type: object
      required: [user, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        expires_at:
          type: string
          format: date-time
    SessionToken:
      type: object
      required: [token, session]
      properties:
        token:
          type: string
          description: Send it as a bearer token. It is shown only once.
        session:
          $ref: "#/components/schemas/Session"
    Urgency:
      type: string
      enum: [high, low]
    ServiceStatus:
      type: string
      enum: [active, disabled]
    IntegrationType:
      type: string
      enum: [generic, alertmanager, grafana, datadog, cloudwatch, google_cloud]
    IntegrationStatus:
      type: string
      enum: [active, disabled]
    Service:
      type: object
      required: [id, name, description, escalation_policy, urgency, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        escalation_policy:
          $ref: "#/components/schemas/Reference"
        urgency:
          $ref: "#/components/schemas/Urgency"
        status:
          $ref: "#/components/schemas/ServiceStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServiceInput:
      type: object
      required: [name, escalation_policy]
      properties:
        name:
          type: string
        description:
          type: string
        escalation_policy:
          $ref: "#/components/schemas/Reference"
        urgency:
          $ref: "#/components/schemas/Urgency"
        status:
          $ref: "#/components/schemas/ServiceStatus"
    ServicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        next_cursor:
          type: string
          description: Empty on the last page.
    Integration:
      type: object
      required: [id, service, name, type, key_version, status, created_at, updated_at]
      properties:
        id:
          type: string
        service:
          $ref: "#/components/schemas/Reference"
        name:
          type: string
        type:
          $ref: "#/components/schemas/IntegrationType"
        key_version:
          type: integer
          format: int32
        previous_key_valid_until:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/IntegrationStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntegrationWithKey:
      allOf:
        - $ref: "#/components/schemas/Integration"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The integration key, sent by monitoring tools in the Authorization header.
    IntegrationCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/IntegrationType"
        status:
          $ref: "#/components/schemas/IntegrationStatus"
    IntegrationUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/IntegrationStatus"
    IntegrationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Integration"
        next_cursor:
          type: string
          description: Empty on the last page.
    IncidentStatus:
      type: string
      enum: [triggered, acknowledged, resolved]
    Incident:
      type: object
      required: [id, number, service, dedup_key, title, status, urgency, created_at, updated_at]
      properties:
        id:
          type: string
        number:
          type: integer
          format: int64
          description: Numbers incidents in the order they were opened, for people to refer to.
        service:
          $ref: "#/components/schemas/Reference"
        dedup_key:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/IncidentStatus"
        urgency:
          $ref: "#/components/schemas/Urgency"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        acknowledged_at:
          type: string
          format: date-time
        escalation:
          $ref: "#/components/schemas/IncidentEscalation"
    IncidentEscalation:
      type: object
      required: [policy, level, round, exhausted]
      description: Where the incident is in its escalation policy. Level 0 means no level has been paged yet.
      properties:
        policy:
          $ref: "#/components/schemas/PolicyVersionReference"
        level:
          type: integer
          format: int32
        round:
          type: integer
          format: int32
          description: Which pass through the levels, from 1; the policy's repeat count adds more passes.
        exhausted:
          type: boolean
          description: Every level and repeat has been paged, or no level could reach anyone.
    TimelineEntry:
      type: object
      required: [id, type, summary, at]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [triggered, alerted, acknowledged, resolved, escalated, escalation_skipped, escalation_exhausted, notified, notification_failed]
        alert:
          $ref: "#/components/schemas/Reference"
        summary:
          type: string
        at:
          type: string
          format: date-time
        escalation:
          $ref: "#/components/schemas/TimelineEscalation"
        notification:
          $ref: "#/components/schemas/TimelineNotification"
    TimelineNotification:
      type: object
      required: [reason, user]
      description: A notification Murphy sent or failed to send. `notification_failed` without a contact method means the person had none.
      properties:
        reason:
          type: string
          enum: [paged, acknowledged, resolved]
        user:
          $ref: "#/components/schemas/Reference"
        contact_method:
          $ref: "#/components/schemas/Reference"
        channel:
          $ref: "#/components/schemas/ContactMethodType"
        failure:
          type: string
          description: Why it failed, on `notification_failed`.
    TimelineEscalation:
      type: object
      required: [level, round, paged, reached_nobody]
      properties:
        level:
          type: integer
          format: int32
        round:
          type: integer
          format: int32
        paged:
          type: array
          description: The people paged, each with the target that reached them.
          items:
            $ref: "#/components/schemas/Page"
        reached_nobody:
          type: array
          description: The level's targets that reached nobody, such as a schedule with no one on call.
          items:
            $ref: "#/components/schemas/EscalationTarget"
    Page:
      type: object
      required: [user, via]
      properties:
        user:
          $ref: "#/components/schemas/Reference"
        via:
          $ref: "#/components/schemas/EscalationTarget"
    SigningKeys:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/SigningKey"
    SigningKey:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string
          description: The Ed25519 public key, as `whpk_` followed by its base64 encoding.
    Reference:
      type: object
      required: [id]
      description: Points at another resource.
      properties:
        id:
          type: string
    PolicyVersionReference:
      type: object
      required: [id, version]
      description: Points at one version of an escalation policy.
      properties:
        id:
          type: string
        version:
          type: integer
          format: int32
    IncidentWithTimeline:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          required: [timeline]
          properties:
            timeline:
              type: array
              items:
                $ref: "#/components/schemas/TimelineEntry"
    IncidentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        next_cursor:
          type: string
          description: Empty on the last page.
    UserStatus:
      type: string
      enum: [active, deactivated]
    User:
      type: object
      required: [id, name, email, time_zone, status, role, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        time_zone:
          type: string
          description: IANA time zone, as in Europe/Malta.
        status:
          $ref: "#/components/schemas/UserStatus"
        role:
          type: string
          enum: [admin, member]
          description: Admins manage the whole install. The first admin is whoever signs in with the install's initial admin email.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
        time_zone:
          type: string
          description: IANA time zone; UTC by default.
        status:
          $ref: "#/components/schemas/UserStatus"
    UserPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          description: Empty on the last page.
    ContactMethodType:
      type: string
      enum: [email, sms, voice, webhook, push]
    ContactMethod:
      type: object
      required: [id, user, type, address, created_at, updated_at]
      properties:
        id:
          type: string
        user:
          $ref: "#/components/schemas/Reference"
        type:
          $ref: "#/components/schemas/ContactMethodType"
        address:
          type: string
          description: An email address, an E.164 phone number, a webhook URL, or a push device's relay handle.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactMethodInput:
      type: object
      required: [type, address]
      properties:
        type:
          $ref: "#/components/schemas/ContactMethodType"
        address:
          type: string
    ContactMethodList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContactMethod"
    Team:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeamInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
    TeamPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
        next_cursor:
          type: string
          description: Empty on the last page.
    TeamRole:
      type: string
      enum: [manager, responder, observer]
    TeamMembership:
      type: object
      required: [team, user, role, created_at, updated_at]
      properties:
        team:
          $ref: "#/components/schemas/Reference"
        user:
          $ref: "#/components/schemas/Reference"
        role:
          $ref: "#/components/schemas/TeamRole"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TeamMemberInput:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/TeamRole"
    TeamMembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMembership"
    Layer:
      type: object
      required: [participants, turn_length_seconds, starts_at]
      properties:
        name:
          type: string
        participants:
          type: array
          description: The people who take turns, in order.
          items:
            $ref: "#/components/schemas/Reference"
        turn_length_seconds:
          type: integer
          format: int64
          description: How long each turn lasts. Whole days hand over at the same local time every day, in the schedule's time zone.
        starts_at:
          type: string
          format: date-time
    Schedule:
      type: object
      required: [id, name, time_zone, teams, layers, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        time_zone:
          type: string
        teams:
          type: array
          description: The teams that use this schedule.
          items:
            $ref: "#/components/schemas/Reference"
        layers:
          type: array
          description: Later layers take precedence over earlier ones once they start.
          items:
            $ref: "#/components/schemas/Layer"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ScheduleInput:
      type: object
      required: [name, layers]
      properties:
        name:
          type: string
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        time_zone:
          type: string
          description: IANA time zone; UTC by default.
        layers:
          type: array
          items:
            $ref: "#/components/schemas/Layer"
    SchedulePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"
        next_cursor:
          type: string
          description: Empty on the last page.
    Override:
      type: object
      required: [id, schedule, user, starts_at, ends_at, created_at]
      properties:
        id:
          type: string
        schedule:
          $ref: "#/components/schemas/Reference"
        user:
          $ref: "#/components/schemas/Reference"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    OverrideInput:
      type: object
      required: [user, starts_at, ends_at]
      properties:
        user:
          $ref: "#/components/schemas/Reference"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    OverrideList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Override"
    OnCall:
      type: object
      required: [at]
      properties:
        at:
          type: string
          format: date-time
        user:
          allOf:
            - $ref: "#/components/schemas/Reference"
          description: Absent when nobody is on call.
    EscalationTargetType:
      type: string
      enum: [user, schedule]
    EscalationTarget:
      type: object
      required: [type, id]
      properties:
        type:
          $ref: "#/components/schemas/EscalationTargetType"
        id:
          type: string
    EscalationLevel:
      type: object
      required: [delay_seconds, targets]
      properties:
        delay_seconds:
          type: integer
          format: int64
          description: How long to wait for an acknowledgement before the next level.
        targets:
          type: array
          items:
            $ref: "#/components/schemas/EscalationTarget"
    EscalationPolicy:
      type: object
      required: [id, name, team, version, repeat_count, levels, created_at, updated_at]
      properties:
        id:
          type: string
        version:
          type: integer
          format: int32
          description: The policy's current version, starting at 1. Every update makes the next one.
        name:
          type: string
        team:
          allOf:
            - $ref: "#/components/schemas/Reference"
          description: The team that owns the policy, and with it the services that page through it.
        repeat_count:
