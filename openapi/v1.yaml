openapi: 3.0.3
info:
  title: Murphy API
  version: v1
  license:
    name: AGPL-3.0
paths:
  /v1/services:
    get:
      operationId: listServices
      summary: List services
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Services, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServicePage"
        "400":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createService
      summary: Create a service
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: The created service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/services/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getService
      summary: Get a service
      tags: [catalog]
      responses:
        "200":
          description: The service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateService
      summary: Update a service
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "200":
          description: The updated service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteService
      summary: Delete a service
      tags: [catalog]
      responses:
        "204":
          description: The service and its integrations were deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/services/{id}/integrations:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: listIntegrations
      summary: List a service's integrations
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: The service's integrations, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationPage"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: createIntegration
      summary: Create an integration
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationCreate"
      responses:
        "201":
          description: The created integration, with its key. The key is only shown in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationWithKey"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/integrations/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getIntegration
      summary: Get an integration
      tags: [catalog]
      responses:
        "200":
          description: The integration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateIntegration
      summary: Update an integration
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationUpdate"
      responses:
        "200":
          description: The updated integration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integration"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteIntegration
      summary: Delete an integration
      tags: [catalog]
      responses:
        "204":
          description: The integration was deleted.
        "404":
          $ref: "#/components/responses/Problem"
  /v1/integrations/{id}/key:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: rotateIntegrationKey
      summary: Rotate an integration's key
      description: Issues a new key and bumps the key version. The previous key keeps working for 24 hours, until previous_key_valid_until.
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The integration, with its new key. The key is only shown in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationWithKey"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/incidents:
    get:
      operationId: listIncidents
      summary: List incidents
      tags: [incidents]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          description: Only incidents with one of these statuses.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IncidentStatus"
      responses:
        "200":
          description: Incidents, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/Problem"
  /v1/incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getIncident
      summary: Get an incident with its timeline
      tags: [incidents]
      responses:
        "200":
          description: The incident and its timeline, oldest entry first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentWithTimeline"
        "404":
          $ref: "#/components/responses/Problem"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Makes retries safe. A retry with the same key and request returns the original response for 24 hours; the same key with a different request is rejected with 422, and a retry while the first request is still running gets 409.
      schema:
        type: string
        maxLength: 255
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Items per page, 50 by default and at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      description: The next_cursor of the previous page.
      schema:
        type: string
  responses:
    Problem:
      description: The request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Urgency:
      type: string
      enum: [high, low]
    ServiceStatus:
      type: string
      enum: [active, disabled]
    IntegrationType:
      type: string
      enum: [generic, alertmanager, grafana, datadog, cloudwatch, google_cloud]
    IntegrationStatus:
      type: string
      enum: [active, disabled]
    Service:
      type: object
      required: [id, name, description, escalation_policy_id, urgency, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        escalation_policy_id:
          type: string
        urgency:
          $ref: "#/components/schemas/Urgency"
        status:
          $ref: "#/components/schemas/ServiceStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServiceInput:
      type: object
      required: [name, escalation_policy_id]
      properties:
        name:
          type: string
        description:
          type: string
        escalation_policy_id:
          type: string
        urgency:
          $ref: "#/components/schemas/Urgency"
        status:
          $ref: "#/components/schemas/ServiceStatus"
    ServicePage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        next_cursor:
          type: string
          description: Empty on the last page.
    Integration:
      type: object
      required: [id, service_id, name, type, key_version, status, created_at, updated_at]
      properties:
        id:
          type: string
        service_id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/IntegrationType"
        key_version:
          type: integer
          format: int32
        previous_key_valid_until:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/IntegrationStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    IntegrationWithKey:
      allOf:
        - $ref: "#/components/schemas/Integration"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: The integration key, sent by monitoring tools in the Authorization header.
    IntegrationCreate:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/IntegrationType"
        status:
          $ref: "#/components/schemas/IntegrationStatus"
    IntegrationUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/IntegrationStatus"
    IntegrationPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Integration"
        next_cursor:
          type: string
          description: Empty on the last page.
    IncidentStatus:
      type: string
      enum: [triggered, acknowledged, resolved]
    Incident:
      type: object
      required: [id, number, service_id, dedup_key, title, status, urgency, created_at, updated_at]
      properties:
        id:
          type: string
        number:
          type: integer
          format: int64
          description: Numbers incidents in the order they were opened, for people to refer to.
        service_id:
          type: string
        dedup_key:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/IncidentStatus"
        urgency:
          $ref: "#/components/schemas/Urgency"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
    TimelineEntry:
      type: object
      required: [id, type, summary, at]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [triggered, alerted, acknowledged, resolved]
        alert_id:
          type: string
        summary:
          type: string
        at:
          type: string
          format: date-time
    IncidentWithTimeline:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          required: [timeline]
          properties:
            timeline:
              type: array
              items:
                $ref: "#/components/schemas/TimelineEntry"
    IncidentPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        next_cursor:
          type: string
          description: Empty on the last page.
    Problem:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string
          description: The trace of this request, to find it in your tracing backend.
