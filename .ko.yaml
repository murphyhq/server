  - linux/arm64

builds:
  - id: ingest
    main: ./cmd/ingest
  - id: api
    main: ./cmd/api
  - id: engine
    main: ./cmd/engine
  - id: scheduler
    main: ./cmd/scheduler
  - id: notifier
    main: ./cmd/notifier
  - id: migrate
    main: ./cmd/migrate
  - id: recover
    main: ./cmd/recover
